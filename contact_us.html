<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background:#f5f7ff;
        }

        .contact{
            padding:60px 20px;
        }

        .contact-content{
            max-width:1100px;
            margin:auto;
            text-align:center;
        }

        .contact h2{
            font-size:40px;
            color:#045cff;
            margin-bottom:20px;
        }

        .contact p{
            font-size:18px;
            color:#444;
        }

        .contact-box{
            display:flex;
            gap:20px;
            justify-content:center;
            flex-wrap:wrap;
            margin-top:40px;
        }

        .box{
            background:white;
            padding:25px;
            width:280px;
            border-radius:12px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

        .box h3{
            color:#045cff;
            margin-bottom:10px;
        }

        .contact-form{
            margin-top:50px;
            display:flex;
            flex-direction:column;
            gap:20px;
            align-items:center;
        }

        .contact-form input,
        .contact-form textarea{
            width:80%;
            max-width:600px;
            padding:15px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
            outline:none;
        }

        .contact-form textarea{
            height:150px;
            resize:none;
        }

        .contact-form button{
            padding:15px 40px;
            border:none;
            background:#045cff;
            color:white;
            font-size:18px;
            border-radius:8px;
            cursor:pointer;
        }

    </style>

</head>

<body>

<section class="contact">

    <div class="contact-content">

        <h2>Contact Us</h2>

        <p>
            If you have any questions or need help,
            feel free to contact us anytime.
        </p>

        <div class="contact-box">

            <div class="box">
                <h3>Address</h3>
                <p>Gwalior, Madhya Pradesh, India</p>
            </div>

            <div class="box">
                <h3>Phone</h3>
                <p>+91 8319723848</p>
            </div>

            <div class="box">
                <h3>Email</h3>
                <p>hms@gmail.com</p>
            </div>

        </div>

        <form class="contact-form">

            <input type="text" placeholder="Enter Your Name" required>

            <input type="email" placeholder="Enter Your Email" required>

            <textarea placeholder="Enter Your Message"></textarea>

            <button type="submit">Send Message</button>

        </form>

    </div>

</section>

</body>
</html>
