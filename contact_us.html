<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background:#f5f7ff;
        }

        .top-bar{
            background:#045cff;
            padding:15px 30px;
        }

        .top-bar a{
            color:white;
            text-decoration:none;
            font-size:18px;
            font-weight:bold;
        }

        .contact{
            padding:60px 20px;
        }

        .contact-content{
            max-width:1100px;
            margin:auto;
            text-align:center;
        }

        .contact h2{
            font-size:40px;
            color:#045cff;
            margin-bottom:20px;
        }

        .contact p{
            font-size:18px;
            color:#444;
        }

        .contact-box{
            display:flex;
            gap:20px;
            justify-content:center;
            flex-wrap:wrap;
            margin-top:40px;
        }

        .box{
            background:white;
            padding:25px;
            width:280px;
            border-radius:12px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

        .box h3{
            color:#045cff;
            margin-bottom:10px;
        }

        .footer{
            background:#045cff;
            color:white;
            text-align:center;
            padding:15px;
            margin-top:50px;
        }

    </style>

</head>

<body>

<div class="top-bar">
    <a href="index.html">Home</a>
</div>

<section class="contact">

    <div class="contact-content">

        <h2>Contact Us</h2>

        <p>
            If you have any questions or need help,
            feel free to contact us anytime.
        </p>

        <div class="contact-box">

            <div class="box">
                <h3>Address</h3>
                <p>Gwalior, Madhya Pradesh, India</p>
            </div>

            <div class="box">
                <h3>Phone</h3>
                <p>+91 8319723848</p>
            </div>

            <div class="box">
                <h3>Email</h3>
                <p>hms@gmail.com</p>
            </div>

        </div>

    </div>

</section>

<div class="footer">
    © 2026 Hospital Management System | All Rights Reserved
</div>

</body>
</html>
